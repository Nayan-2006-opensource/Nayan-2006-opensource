<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Nayan Samadhiya, Data Science and AI/ML">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#161B22"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58A6FF"/><stop offset="1" stop-color="#BC8CFF"/></linearGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#21262D" stroke-width="1"/></pattern>
</defs>
<style>
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 2.4s ease-out .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop{opacity:0;animation:pop .4s ease-out forwards}
@keyframes pop{to{opacity:1}}
.blink{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
</style>
<rect width="900" height="200" rx="16" fill="url(#bg)"/>
<rect width="900" height="200" rx="16" fill="url(#grid)"/>
<rect x="0.5" y="0.5" width="899" height="199" rx="16" fill="none" stroke="#30363D"/>

<text x="48" y="56" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="15" fill="#3FB950">&gt; hello, world<tspan class="blink" fill="#3FB950"> _</tspan></text>
<text x="48" y="104" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="800" fill="#F0F6FC">NAYAN SAMADHIYA</text>
<text x="48" y="140" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="url(#accent)">Data Science · AI / ML</text>
<text x="48" y="168" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8B949E">EE Undergrad @ MANIT Bhopal · Class of 2029</text>

<line x1="580" y1="160" x2="860" y2="160" stroke="#30363D" stroke-width="1.5"/>
<line x1="580" y1="40" x2="580" y2="160" stroke="#30363D" stroke-width="1.5"/>
<polyline class="draw" points="580,148 623,128 666,138 709,98 752,106 795,64 858,46" fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<g fill="#0D1117" stroke="#58A6FF" stroke-width="2.5">
<circle class="pop" style="animation-delay:.6s" cx="623" cy="128" r="5"/>
<circle class="pop" style="animation-delay:1.0s" cx="709" cy="98" r="5"/>
<circle class="pop" style="animation-delay:1.5s" cx="795" cy="64" r="5"/>
<circle class="pop" style="animation-delay:2.2s" cx="858" cy="46" r="6" stroke="#BC8CFF"/>
</g>
</svg>
