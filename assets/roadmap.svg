<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" role="img" aria-label="Learning roadmap: Python, NumPy and Pandas, SQL and EDA done; ML fundamentals in progress; loan default model next; deep learning planned">
